<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pac-Man</title>
  <style>
    canvas {
      display: block;
      margin: 0 auto;
      background: black;
    }
  </style>
</head>
<body>
<canvas id="gameCanvas" width="448" height="480"></canvas>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const TILE_SIZE = 32;
const ROWS = 15;
const COLS = 14;
const MOVE_INTERVAL = 200; // in ms

const maze = [
  "11111111111111",
  "10000000000001",
  "10111101111001",
  "10000001000001",
  "10111011101101",
  "10001000001001",
  "10101111011001",
  "10000000000001",
  "10111101111101",
  "10000001000001",
  "10101111111001",
  "10000000000001",
  "10111111111101",
  "10000000000001",
  "11111111111111"
];

// Store dots as a 2D array
let dots = maze.map(row => row.split('').map(c => c === "0"));

let pacman = {
  x: 1,
  y: 1,
  dx: 0,
  dy: 0,
  color: "yellow"
};

let ghosts = [
  { x: 6, y: 7, color: "red", dir: getRandomDir() },
  { x: 7, y: 7, color: "cyan", dir: getRandomDir() }
];

let keys = {};

window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

function getRandomDir() {
  const dirs = [{dx:-1,dy:0},{dx:1,dy:0},{dx:0,dy:-1},{dx:0,dy:1}];
  return dirs[Math.floor(Math.random()*dirs.length)];
}

function canMove(x, y) {
  return y >= 0 && y < ROWS && x >= 0 && x < COLS && maze[y][x] === "0";
}

function moveEntity(entity) {
  let nextX = entity.x + entity.dx;
  let nextY = entity.y + entity.dy;
  if (canMove(nextX, nextY)) {
    entity.x = nextX;
    entity.y = nextY;
  }
}

function updatePacmanDirection() {
  if (keys["ArrowLeft"] && canMove(pacman.x - 1, pacman.y)) {
    pacman.dx = -1; pacman.dy = 0;
  } else if (keys["ArrowRight"] && canMove(pacman.x + 1, pacman.y)) {
    pacman.dx = 1; pacman.dy = 0;
  } else if (keys["ArrowUp"] && canMove(pacman.x, pacman.y - 1)) {
    pacman.dx = 0; pacman.dy = -1;
  } else if (keys["ArrowDown"] && canMove(pacman.x, pacman.y + 1)) {
    pacman.dx = 0; pacman.dy = 1;
  } else {
    pacman.dx = 0;
    pacman.dy = 0;
  }
}

function drawMaze() {
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (maze[y][x] === "1") {
        ctx.fillStyle = "blue";
        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
      } else if (dots[y][x]) {
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(x * TILE_SIZE + TILE_SIZE/2, y * TILE_SIZE + TILE_SIZE/2, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

function drawCircle(x, y, color) {
  ctx.beginPath();
  ctx.arc(x * TILE_SIZE + TILE_SIZE/2, y * TILE_SIZE + TILE_SIZE/2, TILE_SIZE/2 - 2, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}

function gameTick() {
  updatePacmanDirection();
  moveEntity(pacman);
  if (dots[pacman.y][pacman.x]) {
    dots[pacman.y][pacman.x] = false;
  }

  ghosts.forEach(ghost => {
    let nextX = ghost.x + ghost.dir.dx;
    let nextY = ghost.y + ghost.dir.dy;
    if (canMove(nextX, nextY)) {
      ghost.x = nextX;
      ghost.y = nextY;
    } else {
      ghost.dir = getRandomDir();
    }

    // Collision detection
    if (ghost.x === pacman.x && ghost.y === pacman.y) {
      alert("Game Over!");
      window.location.reload();
    }
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawMaze();
  drawCircle(pacman.x, pacman.y, pacman.color);
  ghosts.forEach(g => drawCircle(g.x, g.y, g.color));
}

// Game loop
setInterval(() => {
  gameTick();
  draw();
}, MOVE_INTERVAL);
</script>
</body>
</html>
